name: Update Lines of Code Badges

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Count LOC and generate badges
        run: |
          pip install requests
          python .github/scripts/count_loc_badges.py > badges.md

      - name: Update README badges safely
        run: |
          awk '
          /<!-- LOC_BADGES_START -->/ {print; system("cat badges.md"); f=1; next}
          /<!-- LOC_BADGES_END -->/ {f=0}
          !f
          ' README.md > tmp && mv tmp README.md

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update LOC badges" || echo "No changes to commit"
          git push
